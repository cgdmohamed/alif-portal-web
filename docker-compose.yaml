services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time (Vite env vars aren't
        # readable at container runtime) — set this in Coolify's
        # environment variables UI before the first deploy.
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL to the Alef Future API's public URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      # Exposes this service's own public URL to Coolify (and to the
      # container, if ever needed) — no explicit `ports:` mapping, since
      # the service listens on 80 and Coolify's proxy routes to it once a
      # domain is assigned in the UI. Written as KEY=value (not a bare
      # KEY) — a bare magic-var entry here has been observed to break
      # Coolify's compose parser ("non-string key in ...environment: 0").
      - SERVICE_FQDN_ADMIN=${SERVICE_FQDN_ADMIN}
