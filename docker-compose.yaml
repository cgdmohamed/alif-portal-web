services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time (Vite env vars aren't
        # readable at container runtime) — set this in Coolify's
        # environment variables UI before the first deploy.
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL to the Alef Future API's public URL}
    restart: unless-stopped
    # Explicit so Coolify's compose parser picks up port 80 (nginx) instead
    # of defaulting to 3000 — it doesn't read the Dockerfile's own EXPOSE.
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # No SERVICE_FQDN_ADMIN entry — nginx never reads it, and declaring it
    # made Coolify seed the application's internal primary-domain field
    # with a placeholder before any real domain existed, which then broke
    # every later deploy ("The string `https://` is no valid url", a crash
    # in Coolify's own ApplicationDeploymentJob::set_coolify_variables()
    # trying to parse that stuck placeholder). Assign the domain purely
    # through Coolify's Domains UI instead — no `ports:` mapping needed,
    # since the service listens on 80 and the proxy routes to it directly.
